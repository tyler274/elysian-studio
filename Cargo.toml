[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/elysian-cli", "crates/elysian-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.90"
repository = "https://github.com/tyler274/elysian-studio"
authors = ["Elysian Studio contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
elysian-geom = { path = "crates/elysian-geom" }
elysian-config = { path = "crates/elysian-config" }
elysian-model = { path = "crates/elysian-model" }
elysian-io = { path = "crates/elysian-io" }
elysian-slicer = { path = "crates/elysian-slicer" }
elysian-gcode = { path = "crates/elysian-gcode" }
elysian-preview = { path = "crates/elysian-preview" }
elysian-gpu = { path = "crates/elysian-gpu" }
elysian-device = { path = "crates/elysian-device" }
elysian-protocol = { path = "crates/elysian-protocol" }
elysian-alloc = { path = "crates/elysian-alloc" }
elysian-wgpu-exp = { path = "crates/elysian-wgpu-exp" }
# Sibling checkout of the mimalloc Rust rewrite (`../mimalloc`).
mimalloc-core = { path = "../mimalloc/rust/crates/elymalloc-core", package = "elymalloc-core" }

base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
clipper2-rust = "1"
glam = "0.29"
iced = { version = "0.14", features = ["tokio", "wgpu", "advanced", "image-without-codecs"] }
jpeg-decoder = { version = "0.3", default-features = false }
openh264 = { version = "0.9", default-features = false, features = ["source"] }
pollster = "0.4"
quick-xml = "0.37"
rand = "0.8"
rayon = "1"
wide = "0.7"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
rsa = { version = "0.9", features = ["pem", "std"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
stl_io = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30.0.1"
x509-parser = "0.16"
zip = { version = "2", default-features = false, features = ["deflate"] }
ab_glyph = "0.2"

[patch.crates-io]
# iced 0.14 compositor + cryoglyph, ported to wgpu 30.0.1.
iced_wgpu = { path = "vendor/iced_wgpu" }
cryoglyph = { path = "vendor/cryoglyph" }
